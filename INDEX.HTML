<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Franklin Lima - 40 Anos</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #fff;
  font-family: 'Playfair Display', serif;
  overflow-x: hidden;
}

/* HEADER */
.header {
  text-align: center;
  padding: 40px 20px;
  position: relative;
}

.logo-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.logo-container img {
  width: 80px;
}

.nome {
  font-size: 28px;
  letter-spacing: 2px;
}

/* EFEITO LUZ CRISTAL */
.luzes {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(#ffffff22 1px, transparent 1px);
  background-size: 30px 30px;
  animation: brilho 6s infinite linear;
}

@keyframes brilho {
  from {transform: translateY(0);}
  to {transform: translateY(100px);}
}

/* FRASE */
.frase-box {
  margin: 80px auto;
  width: 90%;
  max-width: 400px;
  padding: 20px;
  border: 1px solid #444;
  text-align: center;
  cursor: pointer;
  transition: 0.5s;
}

.frase {
  display: none;
  text-align: center;
  padding: 20px;
  font-size: 18px;
  opacity: 0;
  transition: 1s;
}

.frase.show {
  display: block;
  opacity: 1;
}

/* IMAGEM */
.img-section {
  margin: 80px 0;
  opacity: 0;
  transform: translateX(100px);
  transition: 1s;
}

.img-section.show {
  opacity: 1;
  transform: translateX(0);
}

.img-section img {
  width: 90%;
  border-radius: 10px;
}

/* DATA */
.info {
  text-align: center;
  margin: 60px 20px;
  opacity: 0;
  transform: translateY(50px);
  transition: 1s;
}

.info.show {
  opacity: 1;
  transform: translateY(0);
}

/* BOTÃO */
.btn {
  background: white;
  color: black;
  padding: 15px;
  border: none;
  margin-top: 20px;
  cursor: pointer;
  width: 80%;
  max-width: 300px;
}

/* FORM */
.form {
  display: none;
  margin-top: 20px;
}

.form input {
  padding: 12px;
  width: 80%;
  max-width: 300px;
  margin-bottom: 10px;
}

/* RESPONSIVO */
@media (min-width: 768px) {
  .nome {
    font-size: 40px;
  }

  .frase {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="luzes"></div>

  <div class="logo-container">
    <img src="LOGO.jpg">
    <div class="nome">FRANKLIN LIMA</div>
  </div>
</div>

<div class="frase-box" onclick="revelar()">
  CLIQUE PARA REVELAR A FRASE
</div>

<div class="frase" id="frase">
  AOS 40 ANOS VOCÊ NÃO COMEMORA IDADE,<br>
  VOCÊ MUDA DE NÍVEL.
</div>

<div class="img-section" id="img">
  <center><img src="FESTA.jpg"></center>
</div>

<div class="info" id="info">
  <h2>SEXTA FEIRA</h2>
  <h1>22 DE JANEIRO DE 2027</h1>
  <p>ÀS 21:30</p>

  <p style="margin-top:20px;">
    📍 ESPAÇO LOOP - RUA DAS FIGUEIRAS, 1382<br>
    SÃO PAULO SP
  </p>

  <button class="btn" onclick="abrirForm()">MARCAR PRESENÇA</button>

  <form class="form" action="https://formsubmit.co/SEUEMAIL@gmail.com" method="POST">
    <input type="text" name="nome" placeholder="Nome completo" required>
    
    <input type="hidden" name="_subject" value="Nova presença confirmada">
    
    <button class="btn">ENVIAR</button>
  </form>
</div>

<script>

function revelar() {
  document.querySelector(".frase-box").style.display = "none";
  document.getElementById("frase").classList.add("show");
}

function abrirForm() {
  document.querySelector(".form").style.display = "block";
}

/* ANIMAÇÕES SCROLL */
window.addEventListener("scroll", () => {
  let img = document.getElementById("img");
  let info = document.getElementById("info");

  let pos = window.scrollY + window.innerHeight;

  if (pos > img.offsetTop) {
    img.classList.add("show");
  }

  if (pos > info.offsetTop) {
    info.classList.add("show");
  }
});

</script>

</body>
</html>
